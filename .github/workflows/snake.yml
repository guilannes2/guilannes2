name: Generate contribution graph animation

on:
  schedule: [{ cron: "0 6 * * *" }]   # diariamente às 06:00 UTC
  workflow_dispatch:                   # permite rodar manualmente
  push: { branches: [main] }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVG a partir do gráfico de contribuições
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#1a3a5c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
