<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     role="img" aria-label="Guilherme Lannes de Souza — AI-enabled automation and secure systems integration">

  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="62%">
      <stop offset="0%"   stop-color="#12161c"/>
      <stop offset="55%"  stop-color="#05070a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="#000000"/>
  <rect width="1200" height="420" fill="url(#glow)"/>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1"
             dur="1.1s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 16; 0 0" keyTimes="0;1"
                      calcMode="spline" keySplines="0.16 0.8 0.24 1"
                      dur="1.1s" begin="0.3s" fill="freeze"/>
    <text x="600" y="198" text-anchor="middle" fill="#ffffff" font-size="58"
          font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif">
      Guilherme Lannes de Souza
    </text>
  </g>

  <!-- rule, drawn outward from centre -->
  <line x1="600" y1="246" x2="600" y2="246" stroke="#39424e" stroke-width="1">
    <animate attributeName="x1" values="600;462" keyTimes="0;1"
             calcMode="spline" keySplines="0.16 0.8 0.24 1"
             dur="1.0s" begin="1.0s" fill="freeze"/>
    <animate attributeName="x2" values="600;738" keyTimes="0;1"
             calcMode="spline" keySplines="0.16 0.8 0.24 1"
             dur="1.0s" begin="1.0s" fill="freeze"/>
  </line>

  <!-- discipline line -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1"
             dur="1.1s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 10; 0 0" keyTimes="0;1"
                      calcMode="spline" keySplines="0.16 0.8 0.24 1"
                      dur="1.1s" begin="1.5s" fill="freeze"/>
    <text x="600" y="292" text-anchor="middle" fill="#8b949e" font-size="15"
          letter-spacing="4.2"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      AI-ENABLED AUTOMATION &#183; SECURE SYSTEMS INTEGRATION
    </text>
  </g>

</svg>
