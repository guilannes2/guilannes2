<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340"
     role="img" aria-label="Think different. AI-enabled automation and secure systems integration">

  <!-- sem retangulo de fundo: o card do README aparece atraves e o banner se funde -->

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1"
             dur="1.1s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 16; 0 0" keyTimes="0;1"
                      calcMode="spline" keySplines="0.16 0.8 0.24 1"
                      dur="1.1s" begin="0.3s" fill="freeze"/>
    <text x="600" y="172" text-anchor="middle" fill="#f0f6fc" font-size="66"
          font-family="Palatino, 'Palatino Linotype', 'Book Antiqua', Georgia, 'Times New Roman', serif">Think different.</text>
  </g>

  <line x1="600" y1="216" x2="600" y2="216" stroke="#3d444d" stroke-width="1">
    <animate attributeName="x1" values="600;462" keyTimes="0;1"
             calcMode="spline" keySplines="0.16 0.8 0.24 1"
             dur="1.0s" begin="1.0s" fill="freeze"/>
    <animate attributeName="x2" values="600;738" keyTimes="0;1"
             calcMode="spline" keySplines="0.16 0.8 0.24 1"
             dur="1.0s" begin="1.0s" fill="freeze"/>
  </line>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1"
             dur="1.1s" begin="1.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
                      values="0 10; 0 0" keyTimes="0;1"
                      calcMode="spline" keySplines="0.16 0.8 0.24 1"
                      dur="1.1s" begin="1.5s" fill="freeze"/>
    <text x="600" y="260" text-anchor="middle" fill="#9198a1" font-size="15"
          letter-spacing="4.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      AI-ENABLED AUTOMATION &#183; SECURE SYSTEMS INTEGRATION</text>
  </g>

</svg>
